[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.1.0"
description = "ARGUS — financial intelligence system for US equities (repository skeleton)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "ARGUS" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
# Optional: only the language-model renderer in Module 16 uses this, and
# ARGUS runs — and its whole test suite passes — without it.
llm = [
    "anthropic>=0.40",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.7",
]

# Package manager choice: plain pip + PEP 621 pyproject.toml (not Poetry).
# There are no published packages here — Poetry's lockfile/resolver
# machinery buys nothing yet. Plain pip keeps the skeleton simple; this can
# be revisited once core/ and data/ pick up the heavier dependencies
# (pandas/numpy/scikit-learn) with versions worth pinning.
[tool.setuptools.packages.find]
include = ["core*", "services*", "data*", "packages*", "infra*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["core", "services", "data", "packages", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length is handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["core", "data", "infra", "packages", "services", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

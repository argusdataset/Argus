[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.1.0"
description = "ARGUS — financial intelligence system for US equities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "ARGUS" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    # Module 19's Terminal API. Chosen over the alternatives because the
    # project already depends on Pydantic 2 and httpx and already
    # configures pytest-asyncio — the skeleton was assembled expecting an
    # async HTTP service tested with httpx, and FastAPI serves the
    # response models in services/terminal/schemas.py and documents them
    # from the same definition rather than a second one that can drift.
    "fastapi>=0.115",
    # Module 22's password hashing. Argon2id rather than bcrypt because
    # memory-hardness is what costs an attacker with GPUs, and because
    # bcrypt silently truncates at 72 bytes.
    "argon2-cffi>=23.1",
    # Module 22's TOTP. RFC 6238 is short enough to hand-roll and the
    # details that go wrong — base32 secrets, provisioning URIs, the skew
    # window — are exactly the ones a library gets right. Replay
    # protection is ARGUS's own, in services/identity/mfa.py.
    "pyotp>=2.9",
    # Module 25's ASGI server. FastAPI needs one to actually serve, and
    # until this module there was nowhere to serve from — Modules 19-22
    # built apps that only ever ran under `TestClient`. `[standard]`
    # brings httptools and uvloop, which is what makes it a production
    # server rather than a development one.
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Optional: only the language-model renderer in Module 16 uses this, and
# ARGUS runs — and its whole test suite passes — without it.
llm = [
    "anthropic>=0.40",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.7",
]

# Package manager choice: plain pip + PEP 621 pyproject.toml (not Poetry).
# There are no published packages here — Poetry's lockfile/resolver
# machinery buys nothing yet. Plain pip keeps the skeleton simple; this can
# be revisited once core/ and data/ pick up the heavier dependencies
# (pandas/numpy/scikit-learn) with versions worth pinning.
[tool.setuptools.packages.find]
include = ["core*", "services*", "data*", "packages*", "infra*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["core", "services", "data", "packages", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length is handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["core", "data", "infra", "packages", "services", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Ruff formats Python inside Markdown fences as if it were a module, which
# is wrong for this repository's documentation: the architecture notes
# quote *fragments* — a bare `Column(...)` line from a table definition, an
# import shown mid-sentence — and the formatter rewrites a fragment into
# valid-module shape, turning `Column("x", Text)` into `(Column("x", Text),)`.
# That makes the documentation say something the code does not.
#
# Excluded rather than fixed by relabelling the fences, because the fences
# are right: those blocks are Python and should be highlighted as Python.
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
